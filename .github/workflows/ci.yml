name: CI

# Basic checks only, to keep GitHub Actions minutes low: pull requests and
# manual runs. PostgreSQL integration and container tests run locally
# (`pnpm test:integration`, `pnpm test:container`).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/distrilux_portal_test
  CORS_ORIGINS: http://localhost:5173
  LOG_LEVEL: silent
  OPENSPEC_TELEMETRY: 0

jobs:
  quality:
    name: Format, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      # typecheck, lint, unit tests, architecture, OpenSpec, OpenAPI, skills.
      - run: pnpm verify
      - run: pnpm build
