services:
  api:
    build: .
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/distrilux_portal?schema=public
      ERP_API_URL: ${ERP_API_URL:-}
      ERP_API_KEY: ${ERP_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/distrilux_portal?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distrilux_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distrilux_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
